{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — SkillConnect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    font-family: 'Outfit', sans-serif;
    min-height: 100vh;
    background: url("{% static 'images/login.jpg' %}") center/cover no-repeat;
    position: relative;
    display: flex;
    flex-direction: column;
}

body::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.55) 100%);
}

/* NAVBAR */
.navbar {
    position: relative; z-index: 10;
    padding: 28px 8%;
    display: flex; justify-content: space-between; align-items: center;
}
.navbar-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo-icon {
    width: 34px; height: 34px; background: #8fae74;
    border-radius: 9px; display: flex; align-items: center; justify-content: center;
}
.logo-icon i { color: white; font-size: 14px; }
.navbar-logo span { color: white; font-size: 20px; font-weight: 600; }
.nav-back {
    color: rgba(255,255,255,0.7); text-decoration: none;
    font-size: 14px; font-weight: 500;
    display: flex; align-items: center; gap: 6px;
    transition: color 0.2s;
}
.nav-back:hover { color: white; }

/* CENTER */
.auth-wrapper {
    position: relative; z-index: 2;
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
}

.auth-card {
    width: 100%; max-width: 420px;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.13);
    border-radius: 28px;
    padding: 48px 44px;
    animation: slideUp 0.5s ease both;
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
}

.auth-icon {
    width: 56px; height: 56px;
    background: rgba(143,174,116,0.18);
    border: 1px solid rgba(143,174,116,0.3);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
}
.auth-icon i { color: #b5d49a; font-size: 22px; }

.auth-card h1 {
    font-family: 'Playfair Display', serif;
    font-size: 30px; font-weight: 800;
    color: white; margin-bottom: 6px;
}
.auth-card .subtitle {
    color: rgba(255,255,255,0.5); font-size: 14px;
    font-weight: 300; margin-bottom: 32px;
}

.form-group { margin-bottom: 20px; }
.form-group label {
    display: block; font-size: 12px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: rgba(255,255,255,0.55); margin-bottom: 8px;
}
.input-wrap {
    position: relative;
}
.input-wrap i {
    position: absolute; left: 16px; top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.35); font-size: 14px;
}
.input-wrap input {
    width: 100%;
    padding: 14px 16px 14px 42px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px;
    color: white; font-size: 15px; font-weight: 400;
    outline: none;
    transition: all 0.2s;
    font-family: 'Outfit', sans-serif;
}
.input-wrap input::placeholder { color: rgba(255,255,255,0.3); }
.input-wrap input:focus {
    background: rgba(255,255,255,0.12);
    border-color: rgba(143,174,116,0.55);
    box-shadow: 0 0 0 3px rgba(143,174,116,0.12);
}

.btn-submit {
    width: 100%; margin-top: 8px;
    padding: 15px;
    background: #8fae74; border: none; border-radius: 12px;
    color: white; font-size: 15px; font-weight: 600;
    font-family: 'Outfit', sans-serif;
    cursor: pointer; transition: all 0.25s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-submit:hover {
    background: #7a9962;
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(143,174,116,0.4);
}

.auth-footer {
    text-align: center; margin-top: 28px;
    font-size: 14px; color: rgba(255,255,255,0.45);
}
.auth-footer a { color: #b5d49a; text-decoration: none; font-weight: 600; }
.auth-footer a:hover { color: #8fae74; }

.error-msg {
    background: rgba(239,68,68,0.15);
    border: 1px solid rgba(239,68,68,0.3);
    color: #fca5a5;
    padding: 12px 16px; border-radius: 10px;
    font-size: 13px; margin-bottom: 20px;
    display: flex; align-items: center; gap: 8px;
}

.divider {
    height: 1px; background: rgba(255,255,255,0.1);
    margin: 28px 0; position: relative;
}
</style>
</head>
<body>

<nav class="navbar">
    <a href="{% url 'home' %}" class="navbar-logo">
        <div class="logo-icon"><i class="fa-solid fa-bolt"></i></div>
        <span>SkillConnect</span>
    </a>
    <a href="{% url 'home' %}" class="nav-back">
        <i class="fa-solid fa-arrow-left" style="font-size:12px"></i> Back to Home
    </a>
</nav>

<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-icon"><i class="fa-solid fa-bolt"></i></div>

        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to continue to SkillConnect</p>

        {% if messages %}
            {% for message in messages %}
                <div class="error-msg">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="username" placeholder="Enter your username" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password" placeholder="Enter your password" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                Sign In <i class="fa-solid fa-arrow-right" style="font-size:12px"></i>
            </button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{% url 'signup' %}">Create Account</a>
        </div>

    </div>
</div>

</body>
</html>
