{% extends "base.html" %}
{% load static %}
{% block content %}

<head>
    <title>Login - SkillConnect</title>
    <style>
   body{
    margin:0;
    padding:0;
    font-family: 'Segoe UI', sans-serif;
    height:100vh;
    background: url("{% static 'images/login.jpg' %}") no-repeat center center/cover;
    position: relative;
}

    /* navbar fix */
    .navbar {
        position: relative; /* ensure navbar stays on top */
        z-index: 10;        /* higher than login overlay */
    }

    /* overlay for login page */
    body::before{
        content:"";
        position:absolute;
        top:0; left:0;
        width:100%;
        height:100%;
        background:rgba(0,0,0,0.4);
        backdrop-filter: blur(3px);
        z-index:1; /* below navbar and container */
    }

    .container{
        position: relative;
        z-index: 2; /* above overlay */
        width:100%;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .right-panel{
        width:400px;
        padding:40px;
        border-radius:20px;
        background: rgba(255,255,255,0.15);
        backdrop-filter: blur(15px);
        box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        color:white;
        text-align:center;
    }

    .right-panel h2{
        margin-bottom:10px;
        font-size:30px;
        letter-spacing:1px;
    }

    .right-panel p{
        margin-bottom:25px;
        font-size:14px;
        opacity:0.8;
    }

    label{
        display:block;
        text-align:left;
        margin-top:15px;
        font-size:14px;
    }

    input{
        width:100%;
        padding:12px;
        margin-top:5px;
        border:none;
        border-bottom:2px solid rgba(255,255,255,0.6);
        background:transparent;
        color:white;
        font-size:15px;
        outline:none;
    }

    input::placeholder{
        color:rgba(255,255,255,0.7);
    }

    button{
        width:100%;
        padding:12px;
        margin-top:30px;
        border:none;
        border-radius:25px;
        background: linear-gradient(90deg,#4facfe,#00f2fe);
        color:white;
        font-size:16px;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        transform:scale(1.05);
        box-shadow:0 5px 20px rgba(0,0,0,0.3);
    }

    .register-link{
        margin-top:20px;
        font-size:14px;
    }

    .register-link a{
        color:#00f2fe;
        text-decoration:none;
        font-weight:bold;
    }

    .error{
        color:#ff6b6b;
        font-size:13px;
        margin-bottom:10px;
    }
</style>
</head>

<body>
<div class="container">
    <div class="right-panel">

        <h2>LOGIN</h2>
        <p>Welcome back to SkillConnect</p>

        {% if messages %}
            {% for message in messages %}
                <p class="error">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username" required placeholder="Enter username">

            <label>Password</label>
            <input type="password" name="password" required placeholder="Enter password">

            <button type="submit">Login</button>
        </form>

        <div class="register-link">
            Don't have an account? <a href="{% url 'signup' %}">Register</a>
        </div>

    </div>
</div>
</body>

{% endblock %}
